[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-mojo"
description = "Mojo grammar for tree-sitter"
version = "0.25.0"
keywords = ["parsing", "incremental", "mojo", "tree-sitter"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [
  { name = "Max Brunsfeld", email = "maxbrunsfeld@gmail.com" },
  { name = "Amaan Qureshi", email = "amaanq12@gmail.com" },
  { name = "Ayush Shukla", email = "ayush@shuklaayu.sh" },
]
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/shuklaayush/tree-sitter-mojo"

[project.optional-dependencies]
core = ["tree-sitter~=0.26.0"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
